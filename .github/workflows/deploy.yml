name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build landing
        run: |
          cd site
          npm ci
          npm run assets
          npx vite build --base=/ECG/
        env:
          VITE_APP_URL: /ECG/app
      - name: Build app
        run: |
          npm install
          npm run build -w web -- --base=/ECG/app/
        env:
          VITE_SITE_URL: /ECG
      - name: Assemble
        run: |
          mkdir -p combined/app
          cp -r site/dist/* combined/
          cp -r web/dist/* combined/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
